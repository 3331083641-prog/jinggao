name: Jinggao CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      full_benchmark:
        description: Run complete frozen synthetic hold-out (no local LLM required)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jinggao-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python -m ruff check backend/app tests
      - run: python -m pytest -q
      - run: python benchmark/v2.py
      - run: python benchmark/rule_compiler/evaluate.py --deterministic-only --output tests/generated/rule-compiler-ci.json
      - run: python benchmark/holdout/evaluate.py --smoke --output tests/generated/holdout-ci.json
  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  browser-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m venv backend/.venv
      - run: backend/.venv/Scripts/python.exe -m pip install -r backend/requirements.lock.txt
      - run: npm ci
        working-directory: frontend
      - run: node frontend/node_modules/@playwright/test/cli.js install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File setup.ps1
      - run: backend/.venv/Scripts/python.exe scripts/launcher/acceptance.py --root . --output tests/generated/judge-launch-ci.json
      - run: node scripts/run-e2e.mjs competition-upgrade.spec.ts continuous-review.spec.ts --project=desktop-1440
  full-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.full_benchmark
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python benchmark/holdout/evaluate.py --output tests/generated/holdout-full-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-holdout-results
          path: tests/generated/holdout-full-ci.json
